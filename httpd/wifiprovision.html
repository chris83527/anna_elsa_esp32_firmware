<!doctype html>
<html lang="en_US">
<head>
    <meta charset="utf-8">
    <title>Frozen Wi-Fi Setup</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/httpd/bootstrap.min.css">
    <link rel="stylesheet" href="/httpd/bootstrap-icons.min.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <span class="navbar-brand">Frozen Wi-Fi Setup</span>
    </div>
</nav>

<div class="container-fluid">
    <div class="row flex-nowrap">
        <div class="col-auto col-md-3 col-xl-2 px-sm-2 px-0 bg-dark">
            <div class="d-flex flex-column align-items-center align-items-sm-start px-3 pt-2 text-white min-vh-100">
                <ul class="nav nav-pills flex-column mb-sm-auto mb-0 align-items-center align-items-sm-start" id="menu">
                    <li class="nav-item">
                        <a href="/httpd/index.html" class="nav-link align-middle px-0">
                            <i class="fs-4 bi bi-house"></i> <span class="ms-1 d-none d-sm-inline">Home</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="/httpd/diag.html" class="nav-link align-middle px-0">
                            <i class="fs-4 bi-search"></i> <span class="ms-1 d-none d-sm-inline">Diagnostics</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="/httpd/wifiprovision.html" class="nav-link align-middle px-0">
                            <i class="fs-4 bi-search"></i> <span class="ms-1 d-none d-sm-inline">WiFi Connection</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="/httpd/firmware.html" class="nav-link align-middle px-0">
                            <i class="fs-4 bi-search"></i> <span class="ms-1 d-none d-sm-inline">Firmware</span>
                        </a>
                    </li>
                </ul>
            </div>
        </div>

        <div class="col-md-6">


            <div class="card shadow-sm mb-3" id="network-list">
                <div class="card-header">
                    <h5 class="card-title">Network List</h5>
                </div>
                <div class="card-body">
                    <ul class="list-group mb-3" id="net-list"></ul>
                </div>
                <div class="card-footer">
                    <button id="scan-btn" class="btn btn-secondary btn-sm">Scan Networks</button>
                    <span id="scan-status" class="ms-2 text-muted"></span>
                </div>
            </div>


            <div class="card shadow-sm">
                <div class="card-header">
                    <h5 class="card-title">WiFi Credentials</h5>
                </div>
                <form id="prov-form">
                    <div class="card-body">

                        <div class="mb-3">
                            <label class="form-label">SSID</label>
                            <input type="text" class="form-control" id="ssid" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" id="pass" required>
                        </div>
                    </div>
                    <div class="card-footer" id="prov-status">
                        <button class="btn btn-primary btn-sm " type="submit">Save & Reboot</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="/httpd/bootstrap.min.js"></script>
<script>
    let wifiWS;

    function rssiToBars(rssi) {
        if (rssi >= -60) return 4;
        if (rssi >= -70) return 3;
        if (rssi >= -80) return 2;
        return 1;
    }

    function barsHtml(bars) {
        let html = '';
        for (let i = 1; i <= 4; i++) {
            html += `<span style="display:inline-block;width:4px;height:${4 * i}px;margin-right:2px;` +
                `background-color:${i <= bars ? '#198754' : '#ced4da'}"></span>`;
        }
        return html;
    }

    function securityIcon(auth) {
        switch (auth) {
            case 0:  // WIFI_AUTH_OPEN
                return "🔓";
            case 1:  // WEP (rare)
                return "🛑";
            case 2:  // WPA_PSK
            case 3:  // WPA2_PSK
            case 4:  // WPA_WPA2_PSK
                return "🔐";
            case 5:  // WPA2_ENTERPRISE
            case 6:  // WPA3_PSK
            case 7:  // WPA2_WPA3_PSK
                return "🛡️";
            default:
                return "❓";
        }
    }


    function connectWifiWS() {
        const proto = location.protocol === 'https:' ? 'wss' : 'ws';
        wifiWS = new WebSocket(proto + '://' + location.host + '/ws/wifi');

        wifiWS.onopen = () => {
            document.getElementById('scan-status').textContent = 'Connected';
        };

        wifiWS.onclose = () => {
            document.getElementById('scan-status').textContent = 'Disconnected';
            setTimeout(connectWifiWS, 2000);
        };

        wifiWS.onmessage = (ev) => {
            const msg = JSON.parse(ev.data);
            if (msg.type === 'scan') {
                const list = document.getElementById('net-list');
                list.innerHTML = '';

                msg.networks.forEach(n => {
                    const bars = rssiToBars(n.rssi);
                    const sec = securityIcon(n.auth);

                    const li = document.createElement('li');
                    li.className = 'list-group-item d-flex justify-content-between align-items-center';

                    li.innerHTML = `
      <span>
        <strong>${n.ssid || '(hidden)'}</strong>
        <small class="text-muted ms-2">${n.rssi} dBm</small>
        <span class="ms-2">${sec}</span>
      </span>
      <span>${barsHtml(bars)}</span>
    `;

                    li.onclick = () => {
                        if (n.ssid) document.getElementById('ssid').value = n.ssid;
                    };

                    list.appendChild(li);
                });

                document.getElementById('scan-status').textContent =
                    `Found ${msg.networks.length} networks`;
            }

            if (msg.type === 'status') {
                // could show live RSSI somewhere if you want
            }

        };
    }

    document.getElementById('scan-btn').addEventListener('click', () => {
        wifiWS.send(JSON.stringify({cmd: 'scan'}));
    });

    document.getElementById('prov-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const ssid = document.getElementById('ssid').value;
        const pass = document.getElementById('pass').value;
        const statusEl = document.getElementById('prov-status');

        statusEl.textContent = 'Saving...';

        try {
            const res = await fetch('/provision', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ssid, pass})
            });
            let text;
            text = await res.text();
            statusEl.textContent = text;
        } catch (err) {
            statusEl.textContent = 'Error: ' + err;
        }
    });

    connectWifiWS();
</script>
</body>
</html>
