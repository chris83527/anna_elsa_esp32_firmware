<!doctype html>
<html lang="en_USs">
<head>
    <meta charset="utf-8">
    <title>Frozen Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/httpd/bootstrap.min.css">
    <link rel="stylesheet" href="/httpd/bootstrap-icons.min.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <span class="navbar-brand">Frozen Dashboard</span>
    </div>
</nav>

<div class="container-fluid">
    <div class="row flex-nowrap">
        <div class="col-auto col-md-3 col-xl-2 px-sm-2 px-0 bg-dark">
            <div class="d-flex flex-column align-items-center align-items-sm-start px-3 pt-2 text-white min-vh-100">
                <ul class="nav nav-pills flex-column mb-sm-auto mb-0 align-items-center align-items-sm-start" id="menu">
                    <li class="nav-item">
                        <a href="/httpd/index.html" class="nav-link align-middle px-0">
                            <i class="fs-4 bi bi-house"></i> <span class="ms-1 d-none d-sm-inline">Home</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="/httpd/diag.html" class="nav-link align-middle px-0">
                            <i class="fs-4 bi-search"></i> <span class="ms-1 d-none d-sm-inline">Diagnostics</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="/httpd/wifiprovision.html" class="nav-link align-middle px-0">
                            <i class="fs-4 bi-search"></i> <span class="ms-1 d-none d-sm-inline">WiFi Connection</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="/httpd/firmware.html" class="nav-link align-middle px-0">
                            <i class="fs-4 bi-search"></i> <span class="ms-1 d-none d-sm-inline">Firmware</span>
                        </a>
                    </li>
                </ul>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-header">
                    <h5 class="card-title">Live Status</h5>
                </div>
                <div class="card-body">
                    <p>Credit: €<span id="credit">-</span></p>
                    <p>Bank: €<span id="bank">-</span></p>
                    <p>Transfer: €<span id="transfer">-</span></p>
                    <p>Game count: <span id="gameCount">-</span></p>
                    <p>Total in: €<span id="incomeTotal">-</span></p>
                    <p>Total out: €<span id="payoutTotal">-</span></p>
                    <div class="slidecontainer">
                        <input type="range" min="5" max="100" value="50" class="slider" id="volume">
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-header">
                    <h5 class="card-title">OTA Firmware Upload</h5>
                </div>
                <div class="card-body">
                    <form id="ota-form">
                        <div class="mb-3">
                            <input type="file" class="form-control" id="ota-file" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Upload & Update</button>
                    </form>
                    <div class="mt-2" id="ota-status"></div>
                </div>
            </div>
        </div>
    </div>
</div>



</body>
<script src="/httpd/bootstrap.min.js"></script>
<script srv="/httpd/frozen.js"></script>
</html>
